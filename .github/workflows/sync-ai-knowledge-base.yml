# ===========================================================================
# Sync Architecture Content to Foundry IQ Knowledge Base
# ===========================================================================
# When architecture artifacts change on main, this workflow:
#   1. Enriches PlantUML diagrams into search-optimized Markdown
#   2. Uploads all architecture content to Azure Blob Storage
#   3. Resets and triggers the Azure AI Search indexer
#
# The Foundry IQ knowledge base then serves this indexed content
# via agentic retrieval through the local foundry-proxy.py.
# ===========================================================================

name: Sync AI Knowledge Base

on:
  push:
    branches: [main]
    paths:
      - '**/*.puml'
      - 'architecture/specs/**'
      - 'architecture/metadata/**'
      - 'architecture/events/**'
      - 'architecture/solutions/**'
      - 'decisions/**'
      - 'config/**'
      - 'scripts/puml-enricher.py'
      - 'scripts/sync-content-to-blob.py'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-novatrek-ai-poc
  SEARCH_SERVICE: srch-novatrek-poc
  INDEXER_NAME: architecture-content-indexer
  SEARCH_API_VERSION: '2024-07-01'

jobs:
  sync:
    name: Enrich, Upload, Index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---------------------------------------------------------------
      # Step 1: Enrich PlantUML diagrams
      # ---------------------------------------------------------------
      - name: Enrich PlantUML diagrams
        run: |
          python3 scripts/puml-enricher.py
          echo "Enriched $(ls .enriched-puml/*.md 2>/dev/null | wc -l) PUML files"

      # ---------------------------------------------------------------
      # Step 2: Upload all content to Azure Blob Storage
      # ---------------------------------------------------------------
      - name: Sync content to blob storage
        run: |
          python3 scripts/sync-content-to-blob.py

      # ---------------------------------------------------------------
      # Step 3: Reset and trigger search indexer
      # ---------------------------------------------------------------
      - name: Trigger search indexer
        run: |
          SEARCH_KEY=$(az search admin-key show \
            --service-name "$SEARCH_SERVICE" \
            --resource-group "$RESOURCE_GROUP" \
            --query primaryKey -o tsv)

          SEARCH_URL="https://${SEARCH_SERVICE}.search.windows.net"

          # Reset indexer to force full re-crawl
          curl -sf -X POST \
            "${SEARCH_URL}/indexers/${INDEXER_NAME}/reset?api-version=${SEARCH_API_VERSION}" \
            -H "api-key: ${SEARCH_KEY}" \
            -H "Content-Length: 0"

          echo "Indexer reset complete"

          # Trigger indexer run
          curl -sf -X POST \
            "${SEARCH_URL}/indexers/${INDEXER_NAME}/run?api-version=${SEARCH_API_VERSION}" \
            -H "api-key: ${SEARCH_KEY}" \
            -H "Content-Length: 0"

          echo "Indexer run triggered"

          # Wait and verify
          sleep 30

          STATUS=$(curl -sf \
            "${SEARCH_URL}/indexers/${INDEXER_NAME}/status?api-version=${SEARCH_API_VERSION}" \
            -H "api-key: ${SEARCH_KEY}" \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)['lastResult']
          print(f\"Status: {d['status']}, Docs: {d['itemsProcessed']}, Failed: {d['itemsFailed']}\")
          ")

          echo "$STATUS"
