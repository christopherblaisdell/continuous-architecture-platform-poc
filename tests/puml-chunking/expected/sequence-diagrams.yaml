# Expected Extraction Results for PUML Chunking Test Diagrams
# These YAML files define what the puml-enricher.py should extract from each
# test diagram. Used by test_enricher_extraction.py for automated validation.

# NTK-10020: Emergency Evacuation Flow
NTK-10020-emergency-evacuation:
  classification: sequence
  # Note: enricher only counts `participant` keyword, not actor/database/queue
  # Actual participant declarations: 12 (weather through analytics)
  # actor (not counted), database (not counted), queue (not counted)
  min_participants: 12
  participant_aliases_must_include:
    - weather
    - safety
    - location
    - guides
    - transport
    - notify
    - profiles
    - checkin
    - reservations
    - payments
    - kafka
    - db
  services_must_include:
    - svc-weather
    - svc-safety-compliance
    - svc-location-services
    - svc-guide-management
    - svc-transport-logistics
    - svc-notifications
    - svc-guest-profiles
    - svc-check-in
    - svc-reservations
    - svc-payments
  min_api_calls: 10
  # API calls as they appear in the PUML (enricher extracts raw call text)
  api_calls_must_include:
    - "POST /alerts"
    - "POST /bulk-locate"
    - "POST /emergency-recall"
    - "POST /mass-alert"
    - "POST /bulk-cancel"
  has_title: true
  min_notes: 3

# NTK-10021: Multi-Day Scheduling
NTK-10021-multiday-scheduling:
  classification: sequence
  # Enricher participant regex only matches `participant "..." as ...`
  # actor and database/queue types are not counted
  min_participants: 8
  participant_aliases_must_include:
    - scheduler
    - catalog
    - guides
    - trails
    - weather
    - gear
    - kafka
    - db
  services_must_include:
    - svc-scheduling-orchestrator
    - svc-trip-catalog
    - svc-guide-management
    - svc-trail-management
    - svc-weather
    - svc-gear-inventory
  min_api_calls: 8
  has_title: true
  min_notes: 2

