site_name: AI Toolchain Evaluation -- NovaTrek
site_url: https://ai.evaluation.novatrek.cc
site_description: Comparative evaluation of AI toolchains for enterprise architecture work -- GitHub Copilot, Roo Code + Kong AI, and Claude Code

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Practice Strategy: ai-evaluation/practice-strategy.md
  - Decisions:
    - Decision Framework: ai-evaluation/decisions/decision-framework.md
    - DD-01 Content Injection: ai-evaluation/decisions/dd-01-content-injection.md
    - DD-02 Injection Location: ai-evaluation/decisions/dd-02-injection-location.md
    - DD-03 Billing Model: ai-evaluation/decisions/dd-03-billing-model.md
    - DD-04 AI Provider: ai-evaluation/decisions/dd-04-ai-provider.md
  - Platform Options: ai-evaluation/platform-options.md
  - Evaluation Framework: ai-evaluation/evaluation-framework.md
  - Tools:
    - GitHub Copilot: ai-evaluation/tools/github-copilot.md
    - Roo Code + Kong AI: ai-evaluation/tools/roo-code-kong.md
    - Claude Code: ai-evaluation/tools/claude-code.md
  - Comparisons:
    - Copilot vs Roo Code: ai-evaluation/comparisons/copilot-vs-roocode.md
    - Run Analysis: ai-evaluation/comparisons/run-analysis.md
  - Research:
    - Copilot Billing Mechanics: ai-evaluation/research/copilot-billing.md
    - Kong AI Translation Failures: ai-evaluation/research/kong-failures.md
    - Context Management: ai-evaluation/research/context-management.md
  - Decision Log: ai-evaluation/decision-log.md

extra:
  social: []

copyright: NovaTrek Adventures -- AI Toolchain Evaluation
