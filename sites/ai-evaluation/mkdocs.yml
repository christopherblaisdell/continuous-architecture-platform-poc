site_name: AI Toolchain Evaluation -- NovaTrek
site_url: https://ai.evaluation.novatrek.cc
site_description: Comparative evaluation of AI toolchains for enterprise architecture work -- GitHub Copilot, Roo Code + Kong AI, and Claude Code

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Evaluation Framework: evaluation-framework.md
  - Tools:
    - GitHub Copilot: tools/github-copilot.md
    - Roo Code + Kong AI: tools/roo-code-kong.md
    - Claude Code: tools/claude-code.md
  - Comparisons:
    - Copilot vs Roo Code: comparisons/copilot-vs-roocode.md
    - Run Analysis: comparisons/run-analysis.md
  - Research:
    - Copilot Billing Mechanics: research/copilot-billing.md
    - Kong AI Translation Failures: research/kong-failures.md
    - Context Management: research/context-management.md
  - Data Isolation: data-isolation.md
  - Decision Log: decision-log.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/christopherblaisdell/continuous-architecture-platform-poc

copyright: NovaTrek Adventures -- AI Toolchain Evaluation
