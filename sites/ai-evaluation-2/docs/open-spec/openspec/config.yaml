schema: spec-driven

context: |
  This workspace manages AI instruction rules for GitHub Copilot and Roo Code.
  Rules live in a canonical hub (.ai-instructions/) and are propagated to
  derived tool-specific files via scripts/sync-ai-instructions.sh.

  Governance spec: openspec/specs/ai-instruction-governance/spec.md

  Hub-and-spoke architecture:
    Canonical hub: .ai-instructions/
      - core-instructions.md     (base rules for all modes)
      - universal/               (always-loaded standards)
      - methodologies/           (workflow instructions)
      - standards/               (domain standards)
      - mode-customizations/     (per-mode instructions)

    Derived files (NEVER edit directly — use /opsx:propose):
      - .clinerules
      - .github/copilot-instructions.md
      - .github/instructions/prompt-me.instructions.md
      - .github/instructions/prompt-mirror.instructions.md
      - .github/instructions/plantuml-svg.instructions.md

  Change process:
    1. /opsx:propose "description" — opens a change
    2. /opsx:apply — executes tasks (includes running scripts/sync-ai-instructions.sh)
    3. /opsx:archive — closes the change

  Every proposal design.md MUST reference REQ-GOV-001 through REQ-GOV-004.
  Every proposal tasks.md MUST include a task to run scripts/sync-ai-instructions.sh.
  Every proposal tasks.md MUST include a task to run scripts/validate-ai-instructions.sh.

rules:
  proposal:
    - Reference the governance spec (openspec/specs/ai-instruction-governance/spec.md)
    - Identify which canonical file(s) in .ai-instructions/ will change
    - Identify which derived files will be regenerated by the sync script
    - Include a Non-goals section
  design:
    - Show the before/after diff for each canonical file that changes
    - Confirm that no derived files are edited directly
  tasks:
    - Always include a task to run scripts/sync-ai-instructions.sh after canonical edits
    - Always include a task to verify scripts/validate-ai-instructions.sh passes
    - Keep each task focused on a single file or command
