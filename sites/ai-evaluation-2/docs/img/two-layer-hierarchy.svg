<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Layer 1: Practice Strategy -->
  <rect x="40" y="30" width="880" height="100" rx="12" fill="#3f51b5" filter="url(#shadow)"/>
  <text x="480" y="62" text-anchor="middle" fill="#fff" font-size="13" font-weight="600" letter-spacing="1.5" text-transform="uppercase">LAYER 1 — PRACTICE STRATEGY</text>
  <text x="480" y="85" text-anchor="middle" fill="rgba(255,255,255,0.92)" font-size="15" font-weight="700">How does our practice work with AI?</text>
  <text x="480" y="112" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="12">Operating model · Governance · Adoption path · Quality accountability</text>

  <!-- Connector: Layer 1 → Layer 2 -->
  <line x1="480" y1="130" x2="480" y2="175" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="474,172 480,184 486,172" fill="#9e9e9e"/>
  <text x="500" y="160" fill="#757575" font-size="11" font-style="italic">implemented by</text>

  <!-- Layer 2: Five Decision Blocks -->
  <rect x="40" y="188" width="880" height="22" rx="4" fill="none"/>
  <text x="480" y="204" text-anchor="middle" fill="#757575" font-size="12" font-weight="600" letter-spacing="1.2">LAYER 2 — TOOLCHAIN DECISIONS</text>

  <!-- DD-01 -->
  <rect x="40" y="214" width="160" height="96" rx="8" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="120" y="236" text-anchor="middle" fill="#3f51b5" font-size="12" font-weight="700">DD-01</text>
  <text x="120" y="254" text-anchor="middle" fill="#37474f" font-size="11">Context &amp;</text>
  <text x="120" y="269" text-anchor="middle" fill="#37474f" font-size="11">Configuration</text>
  <text x="120" y="296" text-anchor="middle" fill="#9e9e9e" font-size="9" font-style="italic">How AI acquires</text>
  <text x="120" y="306" text-anchor="middle" fill="#9e9e9e" font-size="9" font-style="italic">domain knowledge</text>

  <!-- DD-02 -->
  <rect x="218" y="214" width="160" height="96" rx="8" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="298" y="236" text-anchor="middle" fill="#3f51b5" font-size="12" font-weight="700">DD-02</text>
  <text x="298" y="254" text-anchor="middle" fill="#37474f" font-size="11">Billing</text>
  <text x="298" y="269" text-anchor="middle" fill="#37474f" font-size="11">Model</text>
  <text x="298" y="296" text-anchor="middle" fill="#9e9e9e" font-size="9" font-style="italic">Per-seat vs per-token</text>
  <text x="298" y="306" text-anchor="middle" fill="#9e9e9e" font-size="9" font-style="italic">pricing structure</text>

  <!-- DD-03 -->
  <rect x="396" y="214" width="160" height="96" rx="8" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="476" y="236" text-anchor="middle" fill="#3f51b5" font-size="12" font-weight="700">DD-03</text>
  <text x="476" y="254" text-anchor="middle" fill="#37474f" font-size="11">AI</text>
  <text x="476" y="269" text-anchor="middle" fill="#37474f" font-size="11">Provider</text>
  <text x="476" y="296" text-anchor="middle" fill="#9e9e9e" font-size="9" font-style="italic">Which vendor</text>
  <text x="476" y="306" text-anchor="middle" fill="#9e9e9e" font-size="9" font-style="italic">and platform</text>

  <!-- DD-04 -->
  <rect x="574" y="214" width="160" height="96" rx="8" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="654" y="236" text-anchor="middle" fill="#3f51b5" font-size="12" font-weight="700">DD-04</text>
  <text x="654" y="254" text-anchor="middle" fill="#37474f" font-size="11">Model</text>
  <text x="654" y="269" text-anchor="middle" fill="#37474f" font-size="11">Routing</text>
  <text x="654" y="296" text-anchor="middle" fill="#9e9e9e" font-size="9" font-style="italic">Model selection for</text>
  <text x="654" y="306" text-anchor="middle" fill="#9e9e9e" font-size="9" font-style="italic">different task types</text>

  <!-- DD-05 -->
  <rect x="752" y="214" width="160" height="96" rx="8" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="832" y="236" text-anchor="middle" fill="#3f51b5" font-size="12" font-weight="700">DD-05</text>
  <text x="832" y="254" text-anchor="middle" fill="#37474f" font-size="11">Model Selection</text>
  <text x="832" y="269" text-anchor="middle" fill="#37474f" font-size="11">Autonomy</text>
  <text x="832" y="296" text-anchor="middle" fill="#9e9e9e" font-size="9" font-style="italic">Architect control</text>
  <text x="832" y="306" text-anchor="middle" fill="#9e9e9e" font-size="9" font-style="italic">over model choice</text>

  <!-- Connector: DD blocks → Platform Options -->
  <line x1="120" y1="310" x2="120" y2="346" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="298" y1="310" x2="298" y2="346" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="476" y1="310" x2="476" y2="346" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="654" y1="310" x2="654" y2="346" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="832" y1="310" x2="832" y2="346" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="120" y1="346" x2="832" y2="346" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="480" y1="346" x2="480" y2="376" stroke="#9e9e9e" stroke-width="2"/>
  <polygon points="474,373 480,385 486,373" fill="#9e9e9e"/>
  <text x="500" y="364" fill="#757575" font-size="11" font-style="italic">compose into</text>

  <!-- Platform Options (all teal/cyan for uniform treatment) -->
  <!-- Option A: Copilot -->
  <rect x="40" y="391" width="270" height="72" rx="8" fill="#e0f2f1" stroke="#26a69a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="175" y="416" text-anchor="middle" fill="#00695c" font-size="12" font-weight="700">Option A</text>
  <text x="175" y="434" text-anchor="middle" fill="#37474f" font-size="12">GitHub Copilot</text>
  <text x="175" y="450" text-anchor="middle" fill="#757575" font-size="10">SaaS · intent-based billing</text>

  <!-- Option B: Roo Code + Kong + RAG -->
  <rect x="335" y="391" width="270" height="72" rx="8" fill="#e0f2f1" stroke="#26a69a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="470" y="416" text-anchor="middle" fill="#00695c" font-size="12" font-weight="700">Option B</text>
  <text x="470" y="434" text-anchor="middle" fill="#37474f" font-size="12">Roo Code + Kong AI</text>
  <text x="470" y="450" text-anchor="middle" fill="#757575" font-size="10">Custom RAG · token-based billing</text>

  <!-- Option C: Bespoke Architecture Agent -->
  <rect x="630" y="391" width="270" height="72" rx="8" fill="#e0f2f1" stroke="#26a69a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="765" y="416" text-anchor="middle" fill="#00695c" font-size="12" font-weight="700">Option C</text>
  <text x="765" y="434" text-anchor="middle" fill="#37474f" font-size="12">Bespoke Architecture Agent</text>
  <text x="765" y="450" text-anchor="middle" fill="#757575" font-size="10">Azure AI Foundry · custom agent</text>

  <!-- Connector: Option C → Sub-decision -->
  <line x1="765" y1="463" x2="765" y2="496" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="759,493 765,505 771,493" fill="#9e9e9e"/>
  <text x="790" y="486" fill="#757575" font-size="10" font-style="italic">requires</text>

  <!-- Sub-decision: VS Code Plugin (renumbered DD-06) -->
  <rect x="630" y="510" width="270" height="80" rx="8" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="765" y="534" text-anchor="middle" fill="#3f51b5" font-size="11" font-weight="700">DD-06</text>
  <text x="765" y="552" text-anchor="middle" fill="#37474f" font-size="11">VS Code AI Plugin</text>
  <text x="765" y="567" text-anchor="middle" fill="#37474f" font-size="10">Build vs Buy</text>
  <text x="765" y="582" text-anchor="middle" fill="#757575" font-size="9">Custom extension · Continue · Cline</text>
</svg>