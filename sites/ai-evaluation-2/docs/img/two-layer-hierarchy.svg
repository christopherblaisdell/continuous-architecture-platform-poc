<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 750" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Layer 1: Practice Strategy -->
  <rect x="40" y="30" width="880" height="100" rx="12" fill="#3f51b5" filter="url(#shadow)"/>
  <text x="480" y="62" text-anchor="middle" fill="#fff" font-size="13" font-weight="600" letter-spacing="1.5" text-transform="uppercase">LAYER 1 — PRACTICE STRATEGY</text>
  <text x="480" y="85" text-anchor="middle" fill="rgba(255,255,255,0.92)" font-size="15" font-weight="700">How does our practice work with AI?</text>
  <text x="480" y="112" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="12">Operating model · Governance · Adoption path · Quality accountability</text>

  <!-- Connector: Layer 1 to Layer 2 -->
  <line x1="480" y1="130" x2="480" y2="175" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="474,172 480,184 486,172" fill="#9e9e9e"/>
  <text x="500" y="160" fill="#757575" font-size="11" font-style="italic">implemented by</text>

  <!-- Layer 2: Six Decision Blocks -->
  <rect x="40" y="188" width="880" height="22" rx="4" fill="none"/>
  <text x="480" y="204" text-anchor="middle" fill="#757575" font-size="12" font-weight="600" letter-spacing="1.2">LAYER 2 — TOOLCHAIN DECISIONS</text>

  <!-- DD-01 -->
  <rect x="28" y="214" width="138" height="96" rx="8" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="97" y="236" text-anchor="middle" fill="#3f51b5" font-size="12" font-weight="700">DD-01</text>
  <text x="97" y="254" text-anchor="middle" fill="#37474f" font-size="11">Context &amp;</text>
  <text x="97" y="269" text-anchor="middle" fill="#37474f" font-size="11">Configuration</text>
  <text x="97" y="296" text-anchor="middle" fill="#9e9e9e" font-size="9" font-style="italic">How AI acquires</text>
  <text x="97" y="306" text-anchor="middle" fill="#9e9e9e" font-size="9" font-style="italic">domain knowledge</text>

  <!-- DD-02 -->
  <rect x="178" y="214" width="138" height="96" rx="8" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="247" y="236" text-anchor="middle" fill="#3f51b5" font-size="12" font-weight="700">DD-02</text>
  <text x="247" y="254" text-anchor="middle" fill="#37474f" font-size="11">Billing</text>
  <text x="247" y="269" text-anchor="middle" fill="#37474f" font-size="11">Model</text>
  <text x="247" y="296" text-anchor="middle" fill="#9e9e9e" font-size="9" font-style="italic">Per-seat vs per-token</text>
  <text x="247" y="306" text-anchor="middle" fill="#9e9e9e" font-size="9" font-style="italic">pricing structure</text>

  <!-- DD-03 -->
  <rect x="328" y="214" width="138" height="96" rx="8" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="397" y="236" text-anchor="middle" fill="#3f51b5" font-size="12" font-weight="700">DD-03</text>
  <text x="397" y="254" text-anchor="middle" fill="#37474f" font-size="11">AI</text>
  <text x="397" y="269" text-anchor="middle" fill="#37474f" font-size="11">Provider</text>
  <text x="397" y="296" text-anchor="middle" fill="#9e9e9e" font-size="9" font-style="italic">Which vendor</text>
  <text x="397" y="306" text-anchor="middle" fill="#9e9e9e" font-size="9" font-style="italic">and platform</text>

  <!-- DD-04 -->
  <rect x="478" y="214" width="138" height="96" rx="8" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="547" y="236" text-anchor="middle" fill="#3f51b5" font-size="12" font-weight="700">DD-04</text>
  <text x="547" y="254" text-anchor="middle" fill="#37474f" font-size="11">Model</text>
  <text x="547" y="269" text-anchor="middle" fill="#37474f" font-size="11">Routing</text>
  <text x="547" y="296" text-anchor="middle" fill="#9e9e9e" font-size="9" font-style="italic">Model selection for</text>
  <text x="547" y="306" text-anchor="middle" fill="#9e9e9e" font-size="9" font-style="italic">different task types</text>

  <!-- DD-05 -->
  <rect x="628" y="214" width="138" height="96" rx="8" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="697" y="236" text-anchor="middle" fill="#3f51b5" font-size="12" font-weight="700">DD-05</text>
  <text x="697" y="254" text-anchor="middle" fill="#37474f" font-size="11">Model Selection</text>
  <text x="697" y="269" text-anchor="middle" fill="#37474f" font-size="11">Autonomy</text>
  <text x="697" y="296" text-anchor="middle" fill="#9e9e9e" font-size="9" font-style="italic">Architect control</text>
  <text x="697" y="306" text-anchor="middle" fill="#9e9e9e" font-size="9" font-style="italic">over model choice</text>

  <!-- DD-06 -->
  <rect x="778" y="214" width="138" height="96" rx="8" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="847" y="236" text-anchor="middle" fill="#3f51b5" font-size="12" font-weight="700">DD-06</text>
  <text x="847" y="254" text-anchor="middle" fill="#37474f" font-size="11">IDE Client</text>
  <text x="847" y="269" text-anchor="middle" fill="#37474f" font-size="11">Selection</text>
  <text x="847" y="296" text-anchor="middle" fill="#9e9e9e" font-size="9" font-style="italic">Which client consumes</text>
  <text x="847" y="306" text-anchor="middle" fill="#9e9e9e" font-size="9" font-style="italic">the custom model</text>

  <!-- Connector: DD blocks to Platform Options -->
  <line x1="97" y1="310" x2="97" y2="346" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="247" y1="310" x2="247" y2="346" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="397" y1="310" x2="397" y2="346" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="547" y1="310" x2="547" y2="346" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="697" y1="310" x2="697" y2="346" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="847" y1="310" x2="847" y2="346" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="97" y1="346" x2="847" y2="346" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="480" y1="346" x2="480" y2="376" stroke="#9e9e9e" stroke-width="2"/>
  <polygon points="474,373 480,385 486,373" fill="#9e9e9e"/>
  <text x="500" y="364" fill="#757575" font-size="11" font-style="italic">compose into</text>

  <!-- Platform Options Row -->
  <!-- Option A: Copilot -->
  <rect x="40" y="391" width="270" height="72" rx="8" fill="#e0f2f1" stroke="#26a69a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="175" y="416" text-anchor="middle" fill="#00695c" font-size="12" font-weight="700">Option A</text>
  <text x="175" y="434" text-anchor="middle" fill="#37474f" font-size="12">GitHub Copilot</text>
  <text x="175" y="450" text-anchor="middle" fill="#757575" font-size="10">SaaS · intent-based billing</text>

  <!-- Option B: Roo Code + Kong + RAG -->
  <rect x="335" y="391" width="270" height="72" rx="8" fill="#e0f2f1" stroke="#26a69a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="470" y="416" text-anchor="middle" fill="#00695c" font-size="12" font-weight="700">Option B</text>
  <text x="470" y="434" text-anchor="middle" fill="#37474f" font-size="12">Roo Code + Kong AI</text>
  <text x="470" y="450" text-anchor="middle" fill="#757575" font-size="10">Custom RAG · token-based billing</text>

  <!-- Option C: Bespoke Architecture Agent -->
  <rect x="630" y="391" width="270" height="72" rx="8" fill="#e0f2f1" stroke="#26a69a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="765" y="416" text-anchor="middle" fill="#00695c" font-size="12" font-weight="700">Option C</text>
  <text x="765" y="434" text-anchor="middle" fill="#37474f" font-size="12">Bespoke Architecture Agent</text>
  <text x="765" y="450" text-anchor="middle" fill="#757575" font-size="10">Azure AI Foundry · custom agent</text>

  <!-- Option D: Hybrid bracket spanning A and C -->
  <line x1="175" y1="463" x2="175" y2="490" stroke="#ff8f00" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="765" y1="463" x2="765" y2="490" stroke="#ff8f00" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="175" y1="490" x2="765" y2="490" stroke="#ff8f00" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="470" y1="490" x2="470" y2="510" stroke="#ff8f00" stroke-width="2"/>
  <polygon points="464,507 470,519 476,507" fill="#ff8f00"/>

  <!-- Option D box -->
  <rect x="270" y="524" width="400" height="80" rx="8" fill="#fff3e0" stroke="#ff8f00" stroke-width="2" filter="url(#shadow)"/>
  <text x="470" y="547" text-anchor="middle" fill="#e65100" font-size="13" font-weight="700">Option D — Hybrid (Recommended)</text>
  <text x="470" y="567" text-anchor="middle" fill="#37474f" font-size="11">Copilot platform + Foundry model via BYOK</text>
  <text x="470" y="585" text-anchor="middle" fill="#757575" font-size="10">A's orchestration · C's custom model · single model picker</text>
  <text x="470" y="600" text-anchor="middle" fill="#ff8f00" font-size="9" font-weight="600">RECOMMENDED</text>

  <!-- Legend -->
  <rect x="280" y="630" width="400" height="100" rx="8" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>
  <text x="480" y="650" text-anchor="middle" fill="#757575" font-size="10" font-weight="600">KEY</text>
  <rect x="300" y="662" width="16" height="12" rx="2" fill="#e8eaf6" stroke="#7986cb" stroke-width="1"/>
  <text x="322" y="673" fill="#37474f" font-size="10">Toolchain Decision (DD-01 through DD-06)</text>
  <rect x="300" y="682" width="16" height="12" rx="2" fill="#e0f2f1" stroke="#26a69a" stroke-width="1"/>
  <text x="322" y="693" fill="#37474f" font-size="10">Platform Option (A, B, C — scored independently)</text>
  <rect x="300" y="702" width="16" height="12" rx="2" fill="#fff3e0" stroke="#ff8f00" stroke-width="1"/>
  <text x="322" y="713" fill="#37474f" font-size="10">Option D — Hybrid composition (A's platform + C's model)</text>
</svg>
