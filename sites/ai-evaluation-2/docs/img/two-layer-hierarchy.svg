<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Layer 1: Practice Strategy -->
  <rect x="40" y="30" width="640" height="100" rx="12" fill="#3f51b5" filter="url(#shadow)"/>
  <text x="360" y="62" text-anchor="middle" fill="#fff" font-size="13" font-weight="600" letter-spacing="1.5" text-transform="uppercase">LAYER 1 — PRACTICE STRATEGY</text>
  <text x="360" y="85" text-anchor="middle" fill="rgba(255,255,255,0.92)" font-size="15" font-weight="700">How does our practice work with AI?</text>
  <text x="360" y="112" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="12">Operating model · Governance · Adoption path · Quality accountability</text>

  <!-- Connector: Layer 1 → Layer 2 -->
  <line x1="360" y1="130" x2="360" y2="175" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="354,172 360,184 366,172" fill="#9e9e9e"/>
  <text x="380" y="160" fill="#757575" font-size="11" font-style="italic">implemented by</text>

  <!-- Layer 2: Four Decision Blocks -->
  <rect x="40" y="188" width="640" height="22" rx="4" fill="none"/>
  <text x="360" y="204" text-anchor="middle" fill="#757575" font-size="12" font-weight="600" letter-spacing="1.2">LAYER 2 — TOOLCHAIN DECISIONS</text>

  <!-- DD-01 -->
  <rect x="40" y="214" width="148" height="80" rx="8" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="114" y="240" text-anchor="middle" fill="#3f51b5" font-size="12" font-weight="700">DD-01</text>
  <text x="114" y="258" text-anchor="middle" fill="#37474f" font-size="11">Content</text>
  <text x="114" y="273" text-anchor="middle" fill="#37474f" font-size="11">Injection</text>

  <!-- DD-02 -->
  <rect x="204" y="214" width="148" height="80" rx="8" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="278" y="240" text-anchor="middle" fill="#3f51b5" font-size="12" font-weight="700">DD-02</text>
  <text x="278" y="258" text-anchor="middle" fill="#37474f" font-size="11">Injection</text>
  <text x="278" y="273" text-anchor="middle" fill="#37474f" font-size="11">Location</text>

  <!-- DD-03 -->
  <rect x="368" y="214" width="148" height="80" rx="8" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="442" y="240" text-anchor="middle" fill="#3f51b5" font-size="12" font-weight="700">DD-03</text>
  <text x="442" y="258" text-anchor="middle" fill="#37474f" font-size="11">Billing</text>
  <text x="442" y="273" text-anchor="middle" fill="#37474f" font-size="11">Model</text>

  <!-- DD-04 -->
  <rect x="532" y="214" width="148" height="80" rx="8" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="606" y="240" text-anchor="middle" fill="#3f51b5" font-size="12" font-weight="700">DD-04</text>
  <text x="606" y="258" text-anchor="middle" fill="#37474f" font-size="11">AI</text>
  <text x="606" y="273" text-anchor="middle" fill="#37474f" font-size="11">Provider</text>

  <!-- Connector: DD blocks → Platform Options -->
  <line x1="114" y1="294" x2="114" y2="330" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="278" y1="294" x2="278" y2="330" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="442" y1="294" x2="442" y2="330" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="606" y1="294" x2="606" y2="330" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="114" y1="330" x2="606" y2="330" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="360" y1="330" x2="360" y2="360" stroke="#9e9e9e" stroke-width="2"/>
  <polygon points="354,357 360,369 366,357" fill="#9e9e9e"/>
  <text x="380" y="348" fill="#757575" font-size="11" font-style="italic">compose into</text>

  <!-- Platform Options -->
  <!-- Option A: Copilot -->
  <rect x="120" y="375" width="220" height="72" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="230" y="400" text-anchor="middle" fill="#e65100" font-size="12" font-weight="700">Option A</text>
  <text x="230" y="418" text-anchor="middle" fill="#37474f" font-size="12">GitHub Copilot</text>
  <text x="230" y="434" text-anchor="middle" fill="#757575" font-size="10">SaaS · intent-based billing</text>

  <!-- Option B: Roo Code + Kong + RAG -->
  <rect x="380" y="375" width="220" height="72" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="490" y="400" text-anchor="middle" fill="#e65100" font-size="12" font-weight="700">Option B</text>
  <text x="490" y="418" text-anchor="middle" fill="#37474f" font-size="12">Roo Code + Kong AI</text>
  <text x="490" y="434" text-anchor="middle" fill="#757575" font-size="10">Custom RAG · token-based billing</text>
</svg>