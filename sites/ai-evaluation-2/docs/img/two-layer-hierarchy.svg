<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Layer 1: Practice Strategy -->
  <rect x="40" y="30" width="740" height="100" rx="12" fill="#3f51b5" filter="url(#shadow)"/>
  <text x="410" y="62" text-anchor="middle" fill="#fff" font-size="13" font-weight="600" letter-spacing="1.5" text-transform="uppercase">LAYER 1 — PRACTICE STRATEGY</text>
  <text x="410" y="85" text-anchor="middle" fill="rgba(255,255,255,0.92)" font-size="15" font-weight="700">How does our practice work with AI?</text>
  <text x="410" y="112" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="12">Operating model · Governance · Adoption path · Quality accountability</text>

  <!-- Connector: Layer 1 → Layer 2 -->
  <line x1="410" y1="130" x2="410" y2="175" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="404,172 410,184 416,172" fill="#9e9e9e"/>
  <text x="430" y="160" fill="#757575" font-size="11" font-style="italic">implemented by</text>

  <!-- Layer 2: Four Decision Blocks -->
  <rect x="40" y="188" width="740" height="22" rx="4" fill="none"/>
  <text x="410" y="204" text-anchor="middle" fill="#757575" font-size="12" font-weight="600" letter-spacing="1.2">LAYER 2 — TOOLCHAIN DECISIONS</text>

  <!-- DD-01 -->
  <rect x="40" y="214" width="168" height="80" rx="8" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="124" y="237" text-anchor="middle" fill="#3f51b5" font-size="12" font-weight="700">DD-01</text>
  <text x="124" y="255" text-anchor="middle" fill="#37474f" font-size="11">Context &amp;</text>
  <text x="124" y="270" text-anchor="middle" fill="#37474f" font-size="11">Configuration</text>

  <!-- DD-02 -->
  <rect x="228" y="214" width="168" height="80" rx="8" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="312" y="240" text-anchor="middle" fill="#3f51b5" font-size="12" font-weight="700">DD-02</text>
  <text x="312" y="258" text-anchor="middle" fill="#37474f" font-size="11">Billing</text>
  <text x="312" y="273" text-anchor="middle" fill="#37474f" font-size="11">Model</text>

  <!-- DD-03 -->
  <rect x="416" y="214" width="168" height="80" rx="8" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="240" text-anchor="middle" fill="#3f51b5" font-size="12" font-weight="700">DD-03</text>
  <text x="500" y="258" text-anchor="middle" fill="#37474f" font-size="11">AI</text>
  <text x="500" y="273" text-anchor="middle" fill="#37474f" font-size="11">Provider</text>

  <!-- DD-04 -->
  <rect x="604" y="214" width="168" height="80" rx="8" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="688" y="240" text-anchor="middle" fill="#3f51b5" font-size="12" font-weight="700">DD-04</text>
  <text x="688" y="258" text-anchor="middle" fill="#37474f" font-size="11">Model</text>
  <text x="688" y="273" text-anchor="middle" fill="#37474f" font-size="11">Routing</text>

  <!-- Connector: DD blocks → Platform Options -->
  <line x1="124" y1="294" x2="124" y2="330" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="312" y1="294" x2="312" y2="330" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="500" y1="294" x2="500" y2="330" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="688" y1="294" x2="688" y2="330" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="124" y1="330" x2="688" y2="330" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="410" y1="330" x2="410" y2="360" stroke="#9e9e9e" stroke-width="2"/>
  <polygon points="404,357 410,369 416,357" fill="#9e9e9e"/>
  <text x="430" y="348" fill="#757575" font-size="11" font-style="italic">compose into</text>

  <!-- Platform Options -->
  <!-- Option A: Copilot -->
  <rect x="40" y="375" width="230" height="72" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="155" y="400" text-anchor="middle" fill="#e65100" font-size="12" font-weight="700">Option A</text>
  <text x="155" y="418" text-anchor="middle" fill="#37474f" font-size="12">GitHub Copilot</text>
  <text x="155" y="434" text-anchor="middle" fill="#757575" font-size="10">SaaS · intent-based billing</text>

  <!-- Option B: Roo Code + Kong + RAG -->
  <rect x="295" y="375" width="230" height="72" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="410" y="400" text-anchor="middle" fill="#e65100" font-size="12" font-weight="700">Option B</text>
  <text x="410" y="418" text-anchor="middle" fill="#37474f" font-size="12">Roo Code + Kong AI</text>
  <text x="410" y="434" text-anchor="middle" fill="#757575" font-size="10">Custom RAG · token-based billing</text>

  <!-- Option C: Bespoke Architecture Agent -->
  <rect x="550" y="375" width="230" height="72" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="665" y="400" text-anchor="middle" fill="#2e7d32" font-size="12" font-weight="700">Option C</text>
  <text x="665" y="418" text-anchor="middle" fill="#37474f" font-size="12">Bespoke Architecture Agent</text>
  <text x="665" y="434" text-anchor="middle" fill="#757575" font-size="10">Azure AI Foundry · custom agent</text>

  <!-- Connector: Option C → Sub-decision -->
  <line x1="665" y1="447" x2="665" y2="480" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="659,477 665,489 671,477" fill="#9e9e9e"/>
  <text x="690" y="470" fill="#757575" font-size="10" font-style="italic">requires</text>

  <!-- Sub-decision: VS Code Plugin -->
  <rect x="550" y="494" width="230" height="80" rx="8" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="665" y="518" text-anchor="middle" fill="#3f51b5" font-size="11" font-weight="700">DD-05</text>
  <text x="665" y="536" text-anchor="middle" fill="#37474f" font-size="11">VS Code AI Plugin</text>
  <text x="665" y="551" text-anchor="middle" fill="#37474f" font-size="10">Build vs Buy</text>
  <text x="665" y="566" text-anchor="middle" fill="#757575" font-size="9">Custom extension · Continue · Cline</text>
</svg>