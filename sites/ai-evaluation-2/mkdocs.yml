site_name: AI Toolchain Evaluation -- NovaTrek
site_url: https://ai.evaluation.novatrek.cc
site_description: Comparative evaluation of AI toolchains for enterprise architecture work

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Framework:
    - Scoring Results: framework/scoring-results.md
    - Evaluation Approach: framework/evaluation-approach.md
    - Evaluation Methodology: framework/evaluation-methodology.md
  - Decisions:
    - DD-01 Context and Configuration: decisions/dd-01-context-configuration.md
  - Evidence:
    - Platform Landscape: evidence/platform-landscape.md
    - Model Quality at Budget: evidence/model-quality-at-budget.md
    - Build vs Leverage: evidence/build-vs-leverage.md
    - Architecture Is Not Just Coding: evidence/architecture-not-just-coding.md

extra:
  social: []

copyright: NovaTrek Adventures -- AI Toolchain Evaluation
