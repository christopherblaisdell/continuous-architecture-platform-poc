site_name: AI Toolchain Evaluation -- NovaTrek
site_url: https://ai.evaluation.novatrek.cc
site_description: Comparative evaluation of AI toolchains for enterprise architecture work

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Evaluation Methodology: evaluation-methodology.md
  - Build vs Leverage: build-vs-leverage.md

extra:
  social: []

copyright: NovaTrek Adventures -- AI Toolchain Evaluation
