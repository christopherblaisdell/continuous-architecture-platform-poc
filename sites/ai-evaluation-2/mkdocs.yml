site_name: AI Toolchain Evaluation
site_url: https://ai.evaluation.novatrek.cc
site_description: Comparative evaluation of AI toolchains for enterprise architecture work

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Framework:
    - Scoring Results: framework/scoring-results.md
    - Evaluation Approach: framework/evaluation-approach.md
    - Evaluation Methodology: framework/evaluation-methodology.md
    - Copilot Rollout Roadmap: framework/copilot-rollout-roadmap.md
    - File-Type Chunking Strategy: framework/filetype-chunking-strategy.md
  - Decisions:
    - DD-01 Context and Configuration: decisions/dd-01-context-configuration.md
    - DD-02 Billing Model: decisions/dd-02-billing-model.md
    - DD-03 AI Provider: decisions/dd-03-ai-provider.md
    - DD-04 Model Routing: decisions/dd-04-model-routing.md
    - DD-05 Model Selection Autonomy: decisions/dd-05-model-selection-autonomy.md
    - DD-06 IDE Client Selection: decisions/dd-06-ide-client-selection.md
  - Evidence:
    - Platform Landscape: evidence/platform-landscape.md
    - Model Quality at Budget: evidence/model-quality-at-budget.md
    - Build vs Leverage: evidence/build-vs-leverage.md
    - What Does Foundry IQ Actually Require?: evidence/foundry-iq-comparison.md
    - Controlling What Copilot Sees: evidence/context-injection-controls.md
    - "File-Type Handling: A vs C": evidence/filetype-handling-a-vs-c.md
    - Architecture Is Not Just Coding: evidence/architecture-not-just-coding.md
    - "Option D — Hybrid Architecture": evidence/option-d-hybrid-architecture.md
    - Option D POC Validation: evidence/option-d-poc-validation.md
    - "Cost Offset — Free Tier Subsidy": evidence/cost-offset-hybrid-subsidy.md
  - Reference:
    - Glossary: reference/glossary.md
    - Adversarial Validation: reference/adversarial-validation-copilot-vs-rag.md
  - Research:
    - Overview: research/index.md
    - Context Injection Pipeline: research/deep-research-results-context-injection.md
    - Chunking Control by File Type: research/deep-research-results-chunking-control.md
    - Figma Wireframe Chunking: research/deep-research-results-figma-chunking.md
    - PlantUML and OpenAPI Chunking: research/deep-research-results-puml-openapi-chunking.md
    - PlantUML Diagram Chunking: research/deep-research-results-plantuml-chunking.md
    - Self-Managed Embeddings vs Native Indexing: research/deep-research-results-self-managed-embedding-vs-platform-native-indexing.md
    - "Azure AI Search Chunking (Fast)": research/deep-research-results-azure-ai-search-chunking-fast.md
    - "Azure AI Search Chunking (Pro)": research/deep-research-results-azure-ai-search-chunking-pro.md
    - Embeddings Deep Research: research/deep-research-results-embeddings.md
    - Fact-Check Deep Research: research/deep-research-results.md
  - Addendum:
    - Fact-Check Report: addendum/fact-check-report.md
    - Embeddings Analysis: addendum/embeddings-analysis.md
    - "Foundry vs IDE Agents": addendum/azure-ai-foundry-vs-ide-agents.md

extra:
  social: []

copyright: AI Toolchain Evaluation
